[package]
name = "enginefs"
version = "0.1.8"
edition = "2024"

[features]
# Lets a test register an extra trust anchor, so `server`'s proxy tests can
# stand up an HTTPS origin whose chain actually verifies. Off in every release
# build; `server` turns it on through its dev-dependency only.
test-roots = []
# Opens the piece store's unlink to `server`'s cache-cleaner tests, which
# have no engine to go through. Off in every release build, so the cleaner
# cannot reach the unlink in production -- see `piece_store::store`.
test-unlink = []

[dependencies]
# default-features=false + rust-tls keeps the whole crypto stack on rustls +
# aws-lc-rs: librqbit's `rust-tls` feature switches its SHA1 piece-hasher from
# `sha1-crypto-hash` (openssl-backed) to `sha1-ring` (aws-lc-rs-backed) and keeps
# reqwest on rustls, so nothing here pulls in openssl-sys. `http-api-client` is
# kept because backend/librqbit.rs uses librqbit::api::TorrentIdOrHash.
librqbit = { git = "https://github.com/zond/rqbit", rev = "1ba6468a2ce00e238ba307a4d710c3da03f8a27b", default-features = false, features = [
    "rust-tls",
    "http-api-client",
] }
# `librqbit` does not re-export `librqbit_core::lengths::ValidPieceIndex`, which
# `TorrentStorage::has_piece` and `on_piece_completed` take, so a storage
# implemented outside the crate has to name the type itself. Same git rev as
# `librqbit` -- a second copy of these types would be a different `ValidPieceIndex`
# and would not satisfy the trait. `default-features=false` keeps its
# `sha1-crypto-hash` default out of the feature union, which is what the note
# above is protecting.
librqbit-core = { git = "https://github.com/zond/rqbit", rev = "1ba6468a2ce00e238ba307a4d710c3da03f8a27b", default-features = false }
tokio = { version = "1.42.0", features = [
    "rt-multi-thread",
    "macros",
    "fs",
    "io-util",
    "sync",
    "process",
] }
tokio-util = { version = "0.7.17", features = ["rt"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_bencode = "0.2"
serde_json = "1.0.133"
thiserror = "2.0"
tracing = "0.1"
async-trait = "0.1"
bytes = "1.9"
futures = "0.3"
url = "2.5"
hex = "0.4"
regex = "1.11"
anyhow = "1.0"
moka = { version = "0.12.11", features = ["future", "sync"] }
reqwest = { version = "0.13", features = ["json", "rustls"] }
# Mozilla's root program in DER form, for `http_client::http_client_builder`.
# Already in the graph -- `rustls-platform-verifier`, which reqwest's rustls
# feature pulls in, depends on it -- so naming it here compiles nothing new.
webpki-root-certs = "1"
urlencoding = "2.1"
bumpalo = { version = "3.19", features = ["collections"] }
memmap2 = "0.9.9"
parking_lot = "0.12.5"
# Free-space probe (`available_space`) for the pin_download margin check:
# pure Rust on Unix and Windows, default `sync` feature only.
fs4 = "1.1.0"

[dev-dependencies]
tempfile = "3.23.0"
# Paused-clock machinery for `#[tokio::test(start_paused = true)]`; nothing in
# the library itself pauses or advances time, so it must not ship in release.
tokio = { version = "1.42.0", features = ["test-util"] }

# Reads the OS trust store off Android, once, so a device or organisation that
# installed its own CA keeps verifying (see `http_client`). Already in the
# graph under `rustls-platform-verifier`, so this pulls in nothing new. Android
# has no such store to read -- its CAs are PEM files `http_client` reads
# directly -- and this crate does not build for it.
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-native-certs = "0.8"
