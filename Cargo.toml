[workspace]
resolver = "2"
members = [
    "enginefs",
    "server",
    "bindings/async-rar",
    "bindings/libtorrent-sys",
    "stremio-runtime-stub",
    "updater-helper",
]
# async-rar needs libclang and a C++ toolchain (autocxx), and libtorrent-sys
# needs the libtorrent system library; keep them out of bare
# `cargo build`/`cargo test` so headless machines build cleanly. They remain
# workspace members and are built explicitly with `-p <crate>` or via the
# opt-in `rar`/`libtorrent` features.
default-members = [
    "enginefs",
    "server",
    "stremio-runtime-stub",
    "updater-helper",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
