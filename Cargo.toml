[workspace]
resolver = "2"
members = [
    "enginefs",
    "server",
]
# The workspace is pure Rust: librqbit is the sole torrent backend and RAR is
# the pure-Rust `unrar-rs` crate (a direct `server` dependency behind the
# default-on `rar` feature). `members` and `default-members` are identical, so
# bare `cargo build`/`cargo test` build everything with no system libraries.
default-members = [
    "enginefs",
    "server",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# **Warnings are errors, here and not only in CI.**
#
# A dead field is how you find out that a thing you thought was load-bearing
# is not -- a rate measurement that had quietly stopped meaning anything
# tripped exactly this way -- and that signal is worth having at the moment
# it appears rather than at review.
#
# Deliberately at the workspace level and inherited, so a new crate cannot
# quietly opt out by saying nothing.
[workspace.lints.rust]
warnings = "deny"

# These crates are read with their private items: `cargo doc
# --document-private-items` is the view the docs are written for, and CI
# builds it with every warning denied, so a link to a private item is
# checked there. The public view would only turn those links into text.
[workspace.lints.rustdoc]
private_intra_doc_links = "allow"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
all = { level = "deny", priority = -1 }
