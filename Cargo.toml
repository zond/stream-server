[workspace]
resolver = "2"
members = [
    "enginefs",
    "server",
    "bindings/libtorrent-sys",
    "stremio-runtime-stub",
    "updater-helper",
]
# libtorrent-sys needs the libtorrent system library; keep it out of bare
# `cargo build`/`cargo test` so headless machines build cleanly. It remains a
# workspace member and is built explicitly with `-p <crate>` or via the opt-in
# `libtorrent` feature. (RAR is now pure-Rust `unrar-rs`, a direct `server`
# dependency behind the default-on `rar` feature — no separate binding crate.)
default-members = [
    "enginefs",
    "server",
    "stremio-runtime-stub",
    "updater-helper",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
