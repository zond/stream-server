[workspace]
resolver = "2"
members = [
    "enginefs",
    "server",
    "bindings/async-rar",
    "bindings/libtorrent-sys",
    "stremio-runtime-stub",
    "updater-helper",
    "settings-gui",
]
# settings-gui (Slint) needs fontconfig/gtk dev headers; keep it out of bare
# `cargo build`/`cargo test` so headless machines build cleanly. It remains a
# workspace member and is built explicitly with `-p settings-gui`.
default-members = [
    "enginefs",
    "server",
    "bindings/async-rar",
    "bindings/libtorrent-sys",
    "stremio-runtime-stub",
    "updater-helper",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
