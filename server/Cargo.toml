[package]
name = "server"
version = "0.1.8"
edition = "2024"
# What the default build distributes: this package's source is MIT (the
# repository's LICENSE), and the `rar` feature links unrar-rs, which is
# GPL-3.0-or-later, so the binary built from it is under the GPL
# (LICENSE-GPL-3.0). cargo-deb writes this field into the package's
# copyright file. A `--no-default-features` build links no GPL code and is
# MIT alone; the field cannot say so per feature.
license = "MIT AND GPL-3.0-or-later"
description = "Headless torrent and archive streaming server for Stremio clients"
authors = ["Perpetus <perpetus@example.com>"]

[lib]
name = "stream_server"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
enginefs = { path = "../enginefs" }
axum = { version = "0.8.8", features = ["default"] }
tokio = { version = "1.42", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2.4"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
anyhow = "1.0"
tokio-util = { version = "0.7.17", features = ["io", "compat"] }
hex = "0.4"
# The proxy cache's key. A collision would serve one caller's bytes to
# another, so it is a cryptographic digest and not a hasher. The version
# sevenz-rust2 and unrar-rs already compile, so it is one crate, not two.
sha2 = "0.11"
# Per-launch control-API bearer token: random bytes + constant-time compare.
getrandom = "0.4"
subtle = "2.6"
if-addrs = "0.15.0"
# Free-space probe (`cache_budget::available_space` -> statvfs) for the
# published cap, the stream route's floor and the proxy fill's floor. The same
# crate enginefs uses for the pin margin, so the readers of "how much room is
# left" cannot disagree.
fs4 = "1.1.0"
urlencoding = "2.1"
regex = "1.11"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3.31"
async-trait = "0.1.89"
async_zip = { version = "0.0.18", features = ["deflate", "tokio"] }
walkdir = "2.5.0"
url = "2.5.7"
mime_guess = "2.0.5"
# RAR archive streaming via the pure-Rust `unrar-rs` crate. LICENSING: this
# crate is GPL-3.0-or-later. The repo SOURCE stays MIT (the LICENSE file is
# unchanged and contains no unrar-rs code — the crate is only fetched at build
# time), but because the DEFAULT build links unrar-rs, compiled/distributed
# DEFAULT binaries of stream-server are covered by GPL-3.0-or-later. Build with
# `--no-default-features` to produce an MIT-licensed binary with no RAR support
# (the librqbit backend is always compiled and is not a feature).
#
# default-features=false + crypto-rust keeps RAR's decryption in Rust. It no
# longer keeps a C toolchain out of the build: aws-lc-sys is compiled anyway,
# under rustls and under librqbit's SHA-1, so the crate's default
# `crypto-aws-lc` would change RAR's crypto backend and not what the build
# needs.
unrar-rs = { version = "0.7", default-features = false, features = [
    "crypto-rust",
], optional = true }
lz-str = "0.2.1"
tempfile = "3.23.0"
mimalloc = { version = "0.1.48", default-features = false }
# The `--tui` screen, behind the `tui` feature (see [features]).
ratatui = { version = "0.30.0", optional = true }
crossterm = { version = "0.29.0", optional = true }
crossbeam-channel = { version = "0.5.13", optional = true }
dirs = "6.0"
dashmap = "6.1.0"
tar = "0.4.44"
flate2 = "1.1.5"
uuid = "1.19.0"
bytes = "1.11.0"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
ssdp-client = "2.1.0"
fslock = "0.2.1"
# Pure-Rust 7z decompression (also used by tests to write fixtures via the
# default "compress" feature); no C++ toolchain or libclang required.
sevenz-rust2 = "0.22.2"
chrono = "0.4.42"
sysinfo = "0.39.5"

[dev-dependencies]
# Turns on the test-root registry in the same enginefs the tests link, so the
# proxy's TLS fixture can present a chain that verifies, and the retention
# owner's test hook, which is how a proxy test stands inside a pass. Feature
# unification keeps this to test builds -- `cargo build --release` never sees
# it.
enginefs = { path = "../enginefs", features = [
    "test-roots",
    "test-hooks",
    "test-seed",
] }
# Generates that fixture's CA and leaf at run time. The old fixture shipped a
# self-signed CA certificate used as an end entity, which rustls refuses
# whatever it is trusted as, so it could only ever be the unverifiable case.
rcgen = "0.13"
# The integration tests' HTTP client. Only they block; the server never does.
reqwest = { version = "0.13", features = ["blocking"] }

# Paused-clock machinery for `#[tokio::test(start_paused = true)]`, as in
# enginefs; nothing in the shipped crate uses it.
tokio = { version = "1.42", features = ["test-util"] }
# Real .torrent fixtures for the embed tests (`librqbit::create_torrent`);
# the same git pin as enginefs, so nothing extra is compiled.
librqbit = { git = "https://github.com/zond/rqbit", rev = "92343f5ad4c1203f1bc32f945322c47128212809", default-features = false, features = [
    "rust-tls",
    "http-api-client",
] }

[target.'cfg(target_os = "android")'.dependencies]
# The JNI surface stremio-android loads the cdylib through (`src/jni.rs`),
# which no other platform has.
jni = "0.22.4"
# Only to *arm* the Java verifier from `jni::init_android_tls_verifier`, as a
# fallback for a client built without `enginefs::http_client_builder`. No
# client this workspace or librqbit builds constructs it any more; see that
# function's doc comment.
rustls-platform-verifier = "0.7.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }


[features]
# RAR is DEFAULT-ON. The pure-Rust `unrar-rs` backend needs no libclang/C++
# toolchain, so it can ship in the default build. LICENSING: unrar-rs is
# GPL-3.0-or-later, so the default binary is GPL-3.0-or-later (see the dep
# comment above). Build `--no-default-features` for an MIT binary with no RAR
# (RAR requests then return a 501 JSON error); the librqbit backend is always
# compiled and is not a feature.
default = ["rar"]
rar = ["dep:unrar-rs"]
# The desktop binary's `--tui` terminal UI. OFF by default: a feature is the
# package's, not a target's, so a default-on `tui` would link a terminal UI
# stack into the cdylib and into every embedder's library (xtremio's Android
# build among them), none of which has a terminal. The release workflow
# builds the desktop binaries with `--features server/tui`; a binary built
# without it refuses `--tui`.
tui = ["dep:ratatui", "dep:crossterm", "dep:crossbeam-channel"]

[package.metadata.deb]
maintainer = "stream-server maintainers"
copyright = "2025"
# The copyright file carries the GPL, which is what the packaged (default,
# RAR-enabled) binary is distributed under; the MIT notice the source's
# code needs goes beside it.
license-file = ["../LICENSE-GPL-3.0", "0"]
extended-description = "Headless torrent and archive streaming server for Stremio clients: streams torrents, ZIP/7Z/TAR/RAR members and cached HTTP sources over a local HTTP API."
section = "net"
priority = "optional"
assets = [
    ["target/release/server", "usr/bin/stream-server", "755"],
    ["../LICENSE", "usr/share/doc/server/LICENSE-MIT", "644"],
]

[package.metadata.wix]
upgrade-guid = "A1B2C3D4-E5F6-7890-ABCD-EF1234567890"
path-guid = "B2C3D4E5-F678-90AB-CDEF-123456789012"
license = false
eula = false

[build-dependencies]
winres = "0.1"
chrono = "0.4.42"
