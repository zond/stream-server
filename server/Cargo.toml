[package]
name = "server"
version = "0.1.8"
edition = "2024"
# This package's source is MIT (the repository's LICENSE), and the `rar`
# feature links unrar-rs, which is GPL-3.0-or-later. This crate builds no
# binary of its own, so the obligation travels to whoever links it and
# distributes the result -- see the `unrar-rs` dependency comment below.
# A `--no-default-features` build links no GPL code and is MIT alone; the
# field cannot say so per feature.
license = "MIT AND GPL-3.0-or-later"
description = "Headless torrent and archive streaming server for Stremio clients"
authors = ["Perpetus <perpetus@example.com>"]

[lib]
name = "stream_server"
path = "src/lib.rs"

[dependencies]
enginefs = { path = "../enginefs" }
axum = { version = "0.8.8", features = ["default"] }
tokio = { version = "1.42", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2.4"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
anyhow = "1.0"
tokio-util = { version = "0.7.17", features = ["io", "compat"] }
hex = "0.4"
# The proxy cache's key. A collision would serve one caller's bytes to
# another, so it is a cryptographic digest and not a hasher. The version
# sevenz-rust2 and unrar-rs already compile, so it is one crate, not two.
sha2 = "0.11"
# Per-launch control-API bearer token: random bytes + constant-time compare.
getrandom = "0.4"
subtle = "2.6"
if-addrs = "0.15.0"
# Free-space probe (`cache_budget::available_space` -> statvfs) for the
# published cap, the stream route's floor and the proxy fill's floor. The same
# crate enginefs uses for the pin margin, so the readers of "how much room is
# left" cannot disagree.
fs4 = "1.1.0"
urlencoding = "2.1"
regex = "1.11"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3.31"
async-trait = "0.1.89"
async_zip = { version = "0.0.18", features = ["deflate", "tokio"] }
walkdir = "2.5.0"
url = "2.5.7"
mime_guess = "2.0.5"
# RAR archive streaming via the pure-Rust `unrar-rs` crate. LICENSING: this
# crate is GPL-3.0-or-later. The repo SOURCE stays MIT (the LICENSE file is
# unchanged and contains no unrar-rs code — the crate is only fetched at build
# time). This repository distributes no binary at all, so the GPL obligation
# is the EMBEDDER's: any program that links this library with `rar` on and is
# then distributed is distributed under GPL-3.0-or-later, and must ship the
# GPL text (LICENSE-GPL-3.0 here) and unrar-rs's own notice. xtremio does
# both, inside the app. Build with `--no-default-features` to link no GPL
# code and have no RAR support (the librqbit backend is always compiled and
# is not a feature).
#
# default-features=false + crypto-rust keeps RAR's decryption in Rust. It no
# longer keeps a C toolchain out of the build: aws-lc-sys is compiled anyway,
# under rustls and under librqbit's SHA-1, so the crate's default
# `crypto-aws-lc` would change RAR's crypto backend and not what the build
# needs.
unrar-rs = { version = "0.7", default-features = false, features = [
    "crypto-rust",
], optional = true }
lz-str = "0.2.1"
# The FTP client behind `/ftp`, in place of a spawned `curl`. That was the
# last external program this server ran, so with it gone the build and the
# run both need nothing but the crates named here -- which is the whole of
# what makes this library embeddable in an app store binary. Default
# features are off: the crate's own default is the blocking client, and the
# `tokio` feature is the one that fits the runtime everything else here is
# on. `tokio-rustls-aws-lc-rs` is what `ftps://` needs, on the same rustls
# and the same aws-lc-rs provider the rest of the workspace already
# compiles, so it brings no second TLS stack into the graph.
# `deprecated` is what `connect_secure_implicit` lives behind, and implicit
# TLS is exactly what `ftps://` means: the scheme opens the control channel
# inside TLS on 990 rather than negotiating `AUTH TLS` on 21. The crate
# deprecates it because the RFC prefers explicit FTPS; the URL a caller
# hands this route does not, and `curl` -- which this replaced -- read
# `ftps://` the implicit way too. Dropping it would silently turn one
# scheme into a different protocol.
suppaftp = { version = "12.0.0", default-features = false, features = [
    "tokio",
    "tokio-rustls-aws-lc-rs",
    "deprecated",
] }
# Builds the one `ClientConfig` that FTPS connector is handed
# (`routes::ftp::tls_config`). Both are already in the graph under reqwest
# (rustls 0.23) and suppaftp (tokio-rustls 0.26), so naming them here
# compiles nothing new; a client config cannot be built without saying
# `rustls`.
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "aws-lc-rs",
    "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws-lc-rs",
    "tls12",
] }
# Mozilla's root program, compiled in: the anchors FTPS verifies against.
# The same crate and the same major version `enginefs::http_client` gives
# every HTTPS client here, so `/ftp` trusts what `/proxy` trusts.
webpki-root-certs = "1"
tempfile = "3.23.0"
dirs = "6.0"
dashmap = "6.1.0"
tar = "0.4.44"
flate2 = "1.1.5"
uuid = "1.19.0"
bytes = "1.11.0"
# Pure-Rust 7z decompression (also used by tests to write fixtures via the
# default "compress" feature); no C++ toolchain or libclang required.
sevenz-rust2 = "0.22.2"
chrono = "0.4.42"
sysinfo = "0.39.5"

[dev-dependencies]
# The TLS origin `server/tests/proxy.rs` stands up to test what `/proxy` does
# with an HTTPS upstream. The crate used to be a real dependency: it served
# the deleted HTTPS listener, and nothing in the library speaks TLS server-side
# any more.
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
# Turns on the test-root registry in the same enginefs the tests link, so the
# proxy's TLS fixture can present a chain that verifies, and the retention
# owner's test hook, which is how a proxy test stands inside a pass. Feature
# unification keeps this to test builds -- `cargo build --release` never sees
# it.
enginefs = { path = "../enginefs", features = [
    "test-roots",
    "test-hooks",
    "test-seed",
] }
# Generates that fixture's CA and leaf at run time. The old fixture shipped a
# self-signed CA certificate used as an end entity, which rustls refuses
# whatever it is trusted as, so it could only ever be the unverifiable case.
rcgen = "0.13"
# The integration tests' HTTP client. Only they block; the server never does.
reqwest = { version = "0.13", features = ["blocking"] }

# Paused-clock machinery for `#[tokio::test(start_paused = true)]`, as in
# enginefs; nothing in the shipped crate uses it.
tokio = { version = "1.42", features = ["test-util"] }
# Real .torrent fixtures for the embed tests (`librqbit::create_torrent`);
# the same git pin as enginefs, so nothing extra is compiled.
librqbit = { git = "https://github.com/zond/rqbit", rev = "7432b10eef7595c11c6f4b0288a308515840ecc2", default-features = false, features = [
    "rust-tls",
    "http-api-client",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }


[features]
# RAR is DEFAULT-ON. The pure-Rust `unrar-rs` backend needs no libclang/C++
# toolchain, so it can ship in the default build. LICENSING: unrar-rs is
# GPL-3.0-or-later, so a program that links this library with `rar` on is
# distributed under the GPL (see the dep comment above). Build
# `--no-default-features` for an MIT-only build with no RAR (RAR requests
# then return a 501 JSON error); the librqbit backend is always compiled and
# is not a feature.
default = ["rar"]
rar = ["dep:unrar-rs"]

[lints]
workspace = true
