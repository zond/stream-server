version: 2
updates:
  # Rust crates across the whole Cargo workspace (its two crates: server, enginefs)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    # Batch low-risk updates into a single PR to cut noise; majors stay separate.
    groups:
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Actions used by CI (.github/workflows/ci.yml, the only workflow)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
