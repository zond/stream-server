name: Release Build

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
            toolchain: stable
            target: x86_64-pc-windows-msvc

      - name: Install cargo-wix
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix

      - name: Cargo Registry Cache
        uses: actions/cache@v6
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
          key: Windows-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            Windows-cargo-registry-

      - name: Build Release
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --features server/tui
          cargo build --release --target x86_64-pc-windows-msvc -p stremio-runtime-stub

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: server-windows-amd64
          path: |
            target/x86_64-pc-windows-msvc/release/server.exe
            target/x86_64-pc-windows-msvc/release/stremio-runtime.exe

      - name: Build MSI Installer
        run: cargo wix --package server --no-build --nocapture --target x86_64-pc-windows-msvc

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: server-windows-msi
          path: target/wix/*.msi

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Install AppImage Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 wget imagemagick

      - name: Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The desktop binary's `--tui` is a feature, off by default so the
      # library embedders link does not carry it (server/Cargo.toml).
      - name: Build Release
        run: cargo build --release --features server/tui

      - name: Build DEB Package
        run: cargo deb --package server --no-build

      - name: Build AppImage
        run: |
          # Download linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Create AppDir structure
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy binary
          cp target/release/server AppDir/usr/bin/stream-server

          # The binary links unrar-rs and is distributed under the GPL, so
          # its text travels with it; the MIT notice is the source's.
          mkdir -p AppDir/usr/share/doc/stream-server
          cp LICENSE-GPL-3.0 AppDir/usr/share/doc/stream-server/LICENSE-GPL-3.0
          cp LICENSE AppDir/usr/share/doc/stream-server/LICENSE-MIT

          # Create desktop file
          cat > AppDir/usr/share/applications/stream-server.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=Stream Server
          Exec=stream-server
          Icon=stream-server
          Categories=Network;
          EOF

          # Create simple icon (placeholder)
          convert -size 256x256 xc:steelblue -gravity center -pointsize 48 -fill white -annotate 0 "SS" AppDir/usr/share/icons/hicolor/256x256/apps/stream-server.png

          # Build AppImage. No `|| true`, and the upload errors on a missing
          # file: a release without its AppImage fails here rather than
          # going out without it.
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: server-linux-amd64
          path: |
            target/release/server

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: server-linux-deb
          path: target/debian/*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: server-linux-appimage
          # Not the linuxdeploy tool downloaded beside it, which is an
          # AppImage too: matched, it went into the artifact, and it alone
          # satisfied if-no-files-found when the real one was missing.
          path: |
            *.AppImage
            !linuxdeploy-x86_64.AppImage
          if-no-files-found: error

  build-arch:
    name: Build Arch Linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel cmake curl rust git

      - name: Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            target
            /root/.cargo/registry
            /root/.cargo/git
          key: arch-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            arch-cargo-

      - name: Build binary
        run: cargo build --release --features server/tui

      - name: Create PKGBUILD
        run: |
          mkdir -p pkg
          cat > pkg/PKGBUILD << 'EOF'
          # Maintainer: stream-server maintainers
          pkgname=stream-server
          pkgver=@VERSION@
          pkgrel=1
          pkgdesc="Pure-Rust headless torrent streaming server"
          arch=('x86_64')
          url="https://github.com/zond/stream-server"
          # The binary links unrar-rs (GPL-3.0-or-later); the source is MIT.
          license=('MIT AND GPL-3.0-or-later')
          depends=('gcc-libs' 'glibc')
          source=("stream-server" "LICENSE-GPL-3.0" "LICENSE-MIT")
          sha256sums=('SKIP' 'SKIP' 'SKIP')

          package() {
              install -Dm755 "$srcdir/stream-server" "$pkgdir/usr/bin/stream-server"
              install -Dm644 "$srcdir/LICENSE-GPL-3.0" "$pkgdir/usr/share/licenses/$pkgname/LICENSE-GPL-3.0"
              install -Dm644 "$srcdir/LICENSE-MIT" "$pkgdir/usr/share/licenses/$pkgname/LICENSE-MIT"
          }
          EOF
          # The crate's version, so the package cannot fall behind the
          # binary it carries (a literal here sat at 0.1.0 through 0.1.8).
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' server/Cargo.toml | head -n 1)
          test -n "$version"
          sed -i "s/@VERSION@/$version/" pkg/PKGBUILD

          cp target/release/server pkg/stream-server
          cp LICENSE-GPL-3.0 pkg/LICENSE-GPL-3.0
          cp LICENSE pkg/LICENSE-MIT

      - name: Build package
        run: |
          cd pkg
          # Create non-root user for makepkg
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg -sf --noconfirm"

      - name: Upload Arch Package
        uses: actions/upload-artifact@v7
        with:
          name: server-arch-pkg
          path: pkg/*.pkg.tar.zst

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release

          copy_file() {
            src="$1"
            dest="$2"
            [ -f "$src" ] || return 0
            cp "$src" "release/${dest}"
          }

          copy_latest() {
            source_dir="$1"
            pattern="$2"
            dest="$3"
            [ -d "$source_dir" ] || return 0
            src="$(find "$source_dir" -maxdepth 1 -type f -name "$pattern" | sort -V | tail -n 1)"
            [ -n "$src" ] || return 0
            cp "$src" "release/${dest}"
          }

          # Windows
          copy_file artifacts/server-windows-amd64/server.exe stream-server-windows-amd64.exe
          copy_file artifacts/server-windows-amd64/stremio-runtime.exe stremio-runtime-windows-amd64.exe
          copy_latest artifacts/server-windows-msi "*.msi" stream-server-windows-amd64.msi
          # Linux
          copy_file artifacts/server-linux-amd64/server stream-server-linux-amd64
          copy_latest artifacts/server-linux-deb "*.deb" stream-server-linux-amd64.deb
          copy_latest artifacts/server-linux-appimage "*.AppImage" stream-server-linux-amd64.AppImage
          # Arch
          copy_latest artifacts/server-arch-pkg "stream-server-[0-9]*.pkg.tar.zst" stream-server-arch-x86_64.pkg.tar.zst
          # The license texts, beside the portable binaries that carry none:
          # stream-server links unrar-rs and is distributed under the GPL;
          # the MIT notice covers the source and the stremio-runtime stub.
          # From the checkout, not an artifact, so a release never goes out
          # without them.
          cp LICENSE-GPL-3.0 release/LICENSE-GPL-3.0.txt
          cp LICENSE release/LICENSE-MIT.txt
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release/

      - name: Generate release description
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          python scripts/generate_release_notes.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --previous-tag "${prev_tag}" \
            --asset-dir release \
            --output "${GITHUB_WORKSPACE}/RELEASE_BODY.md"

          cat "${GITHUB_WORKSPACE}/RELEASE_BODY.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: ${{ github.workspace }}/RELEASE_BODY.md
          generate_release_notes: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
