name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Matches the 1.98.0 pin in rust-toolchain.toml. The @master ref of
      # this action requires an explicit `toolchain` input; the version-named
      # ref installs that version directly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: Clippy and Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Matches the 1.98.0 pin in rust-toolchain.toml. The @master ref of
      # this action requires an explicit `toolchain` input; the version-named
      # ref installs that version directly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # No apt installs here on purpose: the pure-Rust build must succeed
      # on a machine with no libclang, fontconfig/gtk headers, or system libs.
      #
      # The tree currently carries pre-existing non-correctness clippy
      # warnings (e.g. collapsible_if in enginefs), so gate hard only on the
      # correctness and suspicious groups; everything else stays a warning.
      #
      # The bare invocation lints the workspace default-members, which is
      # exactly the pure-Rust set (identical to `members`).
      - name: Clippy
        run: >-
          cargo clippy --all-targets --
          -D clippy::correctness -D clippy::suspicious -W clippy::all

      - name: Test
        run: cargo test

  mit-build:
    name: MIT build (no RAR)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # RAR is now pure-Rust (`unrar-rs`) and ON BY DEFAULT, so the default
      # test job above already builds and tests it — no libclang, no separate
      # rar job. What still needs its own guard is the MIT escape hatch:
      # `--no-default-features` must keep building WITHOUT unrar-rs
      # (GPL-3.0-or-later), so a distributor can produce an MIT-licensed binary.
      # The librqbit backend is always compiled (it is no longer a feature), so
      # no backend feature needs to be named. No apt installs: this path is pure
      # Rust too.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build MIT escape hatch (no rar)
        run: cargo build -p server --no-default-features

  windows:
    name: Windows Build and Test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      # Matches the 1.98.0 pin in rust-toolchain.toml. The @master ref of
      # this action requires an explicit `toolchain` input; the version-named
      # ref installs that version directly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Default features only (pure-Rust librqbit backend): no ffmpeg, no
      # libclang, no system libraries. This is a cheap cross-platform guard for
      # the default build; the tag-triggered release build stays in release.yml.
      - name: Build
        run: cargo build

      - name: Test
        run: cargo test
