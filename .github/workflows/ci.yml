name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Matches the 1.98.0 pin in rust-toolchain.toml. The @master ref of
      # this action requires an explicit `toolchain` input; the version-named
      # ref installs that version directly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: Clippy and Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Matches the 1.98.0 pin in rust-toolchain.toml. The @master ref of
      # this action requires an explicit `toolchain` input; the version-named
      # ref installs that version directly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # No apt installs here on purpose: the default feature set must build
      # on a machine with no libclang, fontconfig/gtk headers, or libtorrent.
      #
      # The tree currently carries pre-existing non-correctness clippy
      # warnings (e.g. collapsible_if in enginefs), so gate hard only on the
      # correctness and suspicious groups; everything else stays a warning.
      #
      # No --workspace: that would select the native binding crates
      # (async-rar needs libclang, libtorrent-sys needs libtorrent). The
      # bare invocation lints the workspace default-members, which is
      # exactly the pure-Rust set.
      - name: Clippy
        run: >-
          cargo clippy --all-targets --
          -D clippy::correctness -D clippy::suspicious -W clippy::all

      - name: Test
        run: cargo test

  features:
    name: Optional Features
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Opt-in feature paths need native toolchains/headers:
      #   rar -> libclang (autocxx bindings for unrar)
      # The libtorrent feature is intentionally NOT checked here; it needs a
      # multi-minute source build and is already covered by the check job in
      # release.yml.
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      # Matches the 1.98.0 pin in rust-toolchain.toml. The @master ref of
      # this action requires an explicit `toolchain` input; the version-named
      # ref installs that version directly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check rar feature
        run: cargo check -p server --features rar
