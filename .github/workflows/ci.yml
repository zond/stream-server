name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Matches the 1.98.0 pin in rust-toolchain.toml. The @master ref of
      # this action requires an explicit `toolchain` input; the version-named
      # ref installs that version directly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  test:
    name: Clippy and Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Matches the 1.98.0 pin in rust-toolchain.toml. The @master ref of
      # this action requires an explicit `toolchain` input; the version-named
      # ref installs that version directly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # No apt installs here on purpose: the pure-Rust build must succeed
      # on a machine with no libclang, fontconfig/gtk headers, or system libs.
      #
      # No lint flags here on purpose: the policy lives in
      # `[workspace.lints]` and is inherited by every crate, so a local
      # `cargo clippy` gates exactly as this does and a new crate cannot opt
      # out by saying nothing. This used to deny only the correctness and
      # suspicious groups, which left `unused` as output nobody had to read.
      #
      # The bare invocation lints the workspace default-members, which is
      # exactly the pure-Rust set (identical to `members`). `--all-features`
      # so every optional feature is compiled somewhere.
      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test

  mit-build:
    name: MIT build (no RAR)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # RAR is now pure-Rust (`unrar-rs`) and ON BY DEFAULT, so the default
      # test job above already builds and tests it — no libclang, no separate
      # rar job. What still needs its own guard is the MIT escape hatch:
      # `--no-default-features` must keep building WITHOUT unrar-rs
      # (GPL-3.0-or-later), so an embedder can link an MIT-licensed library --
      # this repo builds no binary at all -- and that build must work: the
      # cfg(not(feature = "rar")) paths (RAR answered 501) are only compiled
      # here, so only here can a test reach them. The librqbit backend is always compiled (it is no longer a
      # feature), so no backend feature needs to be named. No apt installs.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Test MIT escape hatch (no rar)
        run: cargo test -p server --no-default-features

  android:
    name: Android check (armv7, aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The app ships to 32-bit ARM (a Chromecast is armeabi-v7a), where
      # usize is 32 bits and off_t can be, and nothing else here builds for
      # it; every cfg(target_os = "android") path -- the Android arm of
      # `enginefs::http_client` among them -- is only compiled here. A check,
      # not a build: nothing links, and no test runs, so a 32-bit arithmetic
      # bug that compiles still gets past.
      #
      # It needs the NDK even so. Build scripts compile C for the target
      # (aws-lc-sys, under rustls and librqbit's sha1), so
      # cargo-ndk points cc at the NDK's clang; the runner image carries an
      # NDK at $ANDROID_NDK_LATEST_HOME.
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Check
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t armeabi-v7a -t arm64-v8a check -p server --all-targets --locked

  windows:
    name: Windows Build and Test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      # Matches the 1.98.0 pin in rust-toolchain.toml. The @master ref of
      # this action requires an explicit `toolchain` input; the version-named
      # ref installs that version directly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Pure Rust: no ffmpeg, no libclang, no system libraries. The only job
      # that compiles the `cfg(windows)` half of `diagnostics` -- the
      # `windows` crate's process and memory queries -- so it is the guard
      # for those, and the one place the tests run on Windows.
      - name: Build
        run: cargo build

      - name: Test
        run: cargo test
